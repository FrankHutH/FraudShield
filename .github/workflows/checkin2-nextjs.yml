# Murilo Lobato - RA: 10752958
name: Check-in 2 - Build Next.js

on:
  push:
    branches:
      - feat/checkin-2-nextjs-20261027
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
