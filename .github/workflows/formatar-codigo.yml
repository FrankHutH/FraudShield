name: Formatar codigo (temporario)
on:
  push:
    branches:
      - formatar-codigo-20261110
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Formatar arquivos do Next e React
        run: npx --yes prettier@3.6.2 --write "Projeto 2/app/**/*.{js,jsx}" "Projeto 2/components/**/*.{js,jsx}" "Projeto 2/scripts/**/*.{mjs,js}" "Projeto 2/next.config.mjs"
      - name: Publicar formatacao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Projeto 2/app" "Projeto 2/components" "Projeto 2/scripts" "Projeto 2/next.config.mjs"
          if ! git diff --cached --quiet; then
            git commit -m "style: organizar indentacao e quebras de linha"
            git push origin HEAD:formatar-codigo-20261110
          fi
