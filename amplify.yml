version: 1
applications:
  - appRoot: 'Projeto 2'
    frontend:
      phases:
        preBuild:
          commands:
            - npm install --no-audit --no-fund
        build:
          commands:
            - npm run build
            - npm run test:smoke
      artifacts:
        baseDirectory: out
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
